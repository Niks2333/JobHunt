name: JobHunt CI

# Start checks whenever code is pushed or a pull request is opened/updated.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Build backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: dotnet restore backend/JobHunt.sln

      - name: Build backend
        run: dotnet build backend/JobHunt.sln --configuration Release --no-restore

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/jobhunt-web
    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/jobhunt-web/package-lock.json

      - name: Install npm version used by the project
        run: npm install --global npm@11.5.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
